# ergon init sync merges these settings of go-cli into .golangci.yml.

linters:
  settings:
    # The production code of the module go.stealthscale.io/cli imports only the standard library.
    # The production code of a format module also imports the parser of its format, and the module
    # charm imports Lip Gloss and colorprofile. An example may import Lip Gloss and colorprofile too.
    # The example of the module charm writes the styled output of a handler with them. The tests of
    # the cli module may also import go.dokimi.dev/assert, and the tests of another module the
    # libraries of its production code. golangci-lint reports any other import.
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - "$all"
            - "!$test"
            - "!**/charm/*.go"
            - "!**/toml/*.go"
            - "!**/yaml/*.go"
            - "!**/examples/*/*.go"
          allow:
            - $gostd
            - go.stealthscale.io/cli
        examples:
          list-mode: strict
          files:
            - "**/examples/*/*.go"
            - "!$test"
          allow:
            - $gostd
            - charm.land/lipgloss/v2
            - github.com/charmbracelet/colorprofile
            - go.stealthscale.io/cli
        formats:
          list-mode: strict
          files:
            - "**/toml/*.go"
            - "**/yaml/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/BurntSushi/toml
            - go.stealthscale.io/cli
            - go.yaml.in/yaml/v3
        charm:
          list-mode: strict
          files:
            - "**/charm/*.go"
            - "!$test"
          allow:
            - $gostd
            - charm.land/lipgloss/v2
            - github.com/charmbracelet/colorprofile
            - go.stealthscale.io/cli
        test:
          list-mode: strict
          files:
            - "$test"
            - "!**/charm/*_test.go"
            - "!**/toml/*_test.go"
            - "!**/yaml/*_test.go"
          allow:
            - $gostd
            - go.stealthscale.io/cli
            - go.dokimi.dev/assert
        format-tests:
          list-mode: strict
          files:
            - "**/toml/*_test.go"
            - "**/yaml/*_test.go"
          allow:
            - $gostd
            - github.com/BurntSushi/toml
            - go.dokimi.dev/assert
            - go.stealthscale.io/cli
            - go.yaml.in/yaml/v3
        charm-tests:
          list-mode: strict
          files:
            - "**/charm/*_test.go"
          allow:
            - $gostd
            - charm.land/lipgloss/v2
            - go.dokimi.dev/assert
            - go.stealthscale.io/cli
    # The package cli returns the error of a Renderer unchanged, as it returns the error of a
    # handler unchanged. The renderer Plain wraps the errors of its writer itself, so a renderer
    # that delegates to Plain returns those errors unchanged too. A file system that delegates to
    # another fs.FS returns its *fs.PathError unchanged, as the contract of fs.FS requires. The Open
    # of cli.OS has the signature of fs.FS.Open, so it returns the *fs.PathError of os.Open
    # unchanged too.
    wrapcheck:
      ignore-interface-regexps:
        - ^cli\.Renderer$
      ignore-sig-regexps:
        - \(go\.stealthscale\.io/cli\.Plain\)\.
        - \.Open\(name string\) \(io/fs\.File, error\)$
        - ^func os\.Open\(name string\) \(\*os\.File, error\)$

formatters:
  settings:
    # gci puts the imports of this module in a group of their own after the standard library and
    # the other modules.
    gci:
      sections:
        - standard
        - default
        - prefix(go.stealthscale.io/cli)
      custom-order: true
